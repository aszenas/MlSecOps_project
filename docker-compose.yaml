services:
  api:
    build: .
    image: mlsecops-api:compose
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - mlflow

  mlflow:
    build: .
    image: mlsecops-api:compose
    working_dir: /home/appuser
    volumes:
      - mlflow_data:/home/appuser
    ports:
      - "127.0.0.1:5000:5000"
    command: >-
      python -m mlflow server
      --host 0.0.0.0
      --port 5000
      --workers 1
      --backend-store-uri sqlite:////home/appuser/mlflow.db
      --serve-artifacts
      --artifacts-destination /home/appuser/mlartifacts
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000
  volumes:
    mlflow_data: