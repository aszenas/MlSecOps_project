[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "unit: isolated unit tests",
    "api: REST API tests",
    "integration: integration tests",
    "smoke: system smoke tests",
]