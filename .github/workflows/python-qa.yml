
name: Python Quality Assurance

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-qa:
    name: Python QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest coverage flake8 pyright
          python -m pip check
          python -c "import mlflow, xgboost, sklearn, pandas, numpy; print('ML dependencies OK')"

      # Mandatory unit tests
      - name: Run unit tests with coverage
        env:
          PYTHONPATH: src
        run: |
          python -m coverage erase
          python -m coverage run -m pytest tests/unit/ -v

      # Mandatory MLflow integration tests (no real CSV required)
      - name: Run MLflow integration tests with coverage
        env:
          PYTHONPATH: src
        run: |
          python -m coverage run --append -m pytest tests/integration/test_mlflow_integration.py -v

      # Dataset-dependent integration tests
      # The MLflow test is excluded because it runs above.
      - name: Run dataset integration tests
        if: hashFiles('data/raw/predictive_maintenance_5000.csv') != ''
        env:
          PYTHONPATH: src
        run: |
          python -m coverage run --append -m pytest tests/integration/ --ignore=tests/integration/test_mlflow_integration.py -v

      # Temporary safeguard until DVC downloads the dataset in CI
      - name: Report missing integration dataset
        if: hashFiles('data/raw/predictive_maintenance_5000.csv') == ''
        run: |
          echo "::warning::CSV-dependent integration tests skipped: dataset unavailable."
          echo "### Dataset integration tests: NOT RUN" >> "$GITHUB_STEP_SUMMARY"
          echo "MLflow integration tests ran separately. DVC setup is pending." >> "$GITHUB_STEP_SUMMARY"

      # Mandatory source code coverage gate
      - name: Check source coverage
        run: |
          python -m coverage report -m --include="src/*" --fail-under=95

      - name: Run Flake8
        run: |
          python -m flake8 src tests infra app scripts

      - name: Run Pyright
        run: |
          python -m pyright
