
name: Python Quality Assurance

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-qa:
    name: Python QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        id: install_dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "dvc[s3]==3.67.1" pytest coverage flake8 pyright
          python -m pip check
          python -c "import mlflow, xgboost, sklearn, pandas, numpy; print('ML dependencies OK')"

      - name: Download versioned dataset from DagsHub
        id: restore_dataset
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DAGSHUB_TOKEN }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::DAGSHUB_TOKEN secret is missing or unavailable."
            exit 1
          fi
          dvc pull data/raw.dvc -r dagshub
          test -f data/raw/predictive_maintenance_5000.csv

      - name: Initialize test and coverage report directories
        if: ${{ always() }}
        run: |
          mkdir -p reports ci-results
          printf 'exit=not-run\n' > ci-results/unit.status
          printf 'exit=not-run\n' > ci-results/mlflow.status
          printf 'exit=not-run\n' > ci-results/integration.status
          printf 'exit=not-run\n' > ci-results/coverage-source.status
          printf 'exit=not-run\n' > ci-results/coverage-combined.status
          printf 'exit=not-run\n' > ci-results/coverage-artifacts.status

      # Mandatory unit tests
      - name: Run unit tests with coverage
        if: ${{ steps.install_dependencies.outcome == 'success' && steps.restore_dataset.outcome == 'success' }}
        env:
          PYTHONPATH: src
        run: |
          set +e
          python -m coverage erase
          erase_status=$?
          python -m coverage run -m pytest tests/unit/ -v --junitxml=reports/junit-unit.xml
          test_status=$?
          set -e
          if [ "$erase_status" -ne 0 ]; then test_status="$erase_status"; fi
          printf 'exit=%s\n' "$test_status" > ci-results/unit.status
          exit "$test_status"

      # Mandatory MLflow integration tests (no real CSV required)
      - name: Run MLflow integration tests with coverage
        if: ${{ always() && steps.install_dependencies.outcome == 'success' && steps.restore_dataset.outcome == 'success' }}
        env:
          PYTHONPATH: src
        run: |
          set +e
          python -m coverage run --append -m pytest tests/integration/test_mlflow_integration.py -v --junitxml=reports/junit-mlflow.xml
          test_status=$?
          set -e
          printf 'exit=%s\n' "$test_status" > ci-results/mlflow.status
          exit "$test_status"

      # Dataset-dependent integration tests
      # The MLflow test is excluded because it runs above.
      - name: Run dataset integration tests
        if: ${{ always() && steps.install_dependencies.outcome == 'success' && steps.restore_dataset.outcome == 'success' }}
        env:
          PYTHONPATH: src
        run: |
          set +e
          python -m coverage run --append -m pytest tests/integration/ --ignore=tests/integration/test_mlflow_integration.py -v --junitxml=reports/junit-integration.xml
          test_status=$?
          set -e
          printf 'exit=%s\n' "$test_status" > ci-results/integration.status
          exit "$test_status"

      # Mandatory source code coverage gate
      - name: Check source coverage
        if: ${{ always() && steps.install_dependencies.outcome == 'success' && steps.restore_dataset.outcome == 'success' }}
        run: |
          set +e
          python -m coverage report -m --include="src/*" --fail-under=95 | tee reports/coverage-source.txt
          coverage_status=${PIPESTATUS[0]}
          set -e
          printf 'exit=%s\n' "$coverage_status" > ci-results/coverage-source.status
          exit "$coverage_status"

      - name: Check combined source and test coverage
        if: ${{ always() && steps.install_dependencies.outcome == 'success' && steps.restore_dataset.outcome == 'success' }}
        run: |
          set +e
          python -m coverage report -m --include="src/*,tests/*" --fail-under=95 | tee reports/coverage-combined.txt
          coverage_status=${PIPESTATUS[0]}
          set -e
          printf 'exit=%s\n' "$coverage_status" > ci-results/coverage-combined.status
          exit "$coverage_status"

      - name: Generate machine-readable and HTML coverage reports
        if: ${{ always() && steps.install_dependencies.outcome == 'success' && steps.restore_dataset.outcome == 'success' }}
        run: |
          set +e
          python -m coverage xml -o reports/coverage.xml
          xml_status=$?
          python -m coverage html -d reports/coverage-html
          html_status=$?
          set -e
          coverage_status=0
          if [ "$xml_status" -ne 0 ]; then coverage_status="$xml_status"; fi
          if [ "$html_status" -ne 0 ] && [ "$coverage_status" -eq 0 ]; then coverage_status="$html_status"; fi
          printf 'exit=%s\n' "$coverage_status" > ci-results/coverage-artifacts.status
          exit "$coverage_status"

      - name: Run Flake8
        if: ${{ always() && steps.install_dependencies.outcome == 'success' && steps.restore_dataset.outcome == 'success' }}
        run: |
          python -m flake8 src tests infra app scripts

      - name: Run Pyright
        if: ${{ always() && steps.install_dependencies.outcome == 'success' && steps.restore_dataset.outcome == 'success' }}
        run: |
          python -m pyright

      - name: Upload test and coverage reports
        id: upload_reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-qa-reports-${{ github.run_id }}
          path: |
            reports/junit-unit.xml
            reports/junit-mlflow.xml
            reports/junit-integration.xml
            reports/coverage-source.txt
            reports/coverage-combined.txt
            reports/coverage.xml
            reports/coverage-html/
          if-no-files-found: warn
          retention-days: 14

      - name: Write Python QA job summary
        if: ${{ always() }}
        env:
          ARTIFACT_UPLOAD_OUTCOME: ${{ steps.upload_reports.outcome }}
        run: |
          status_label() {
            if [ ! -f "$1" ]; then
              printf 'not run/skipped'
              return
            fi
            value=$(cut -d= -f2 "$1")
            if [ "$value" = "0" ]; then
              printf 'passed'
            elif [ "$value" = "not-run" ]; then
              printf 'not run/skipped'
            else
              printf 'failed (exit %s)' "$value"
            fi
          }
          coverage_value() {
            if [ ! -f "$1" ]; then
              printf 'not available'
              return
            fi
            value=$(awk '/^TOTAL/ {value=$NF} END {if (value) print value; else print "not available"}' "$1")
            if [ -n "$value" ]; then printf '%s' "$value"; else printf 'not available'; fi
          }
          coverage_completeness() {
            for status_file in \
              ci-results/unit.status \
              ci-results/mlflow.status \
              ci-results/integration.status; do
              if [ ! -f "$status_file" ] || [ "$(cut -d= -f2 "$status_file")" != "0" ]; then
                printf 'partial'
                return
              fi
            done
            printf 'complete'
          }
          coverage_scope=$(coverage_completeness)
          if [ "$ARTIFACT_UPLOAD_OUTCOME" = "success" ]; then
            artifact_result='available after successful upload'
          else
            artifact_result="unavailable (upload ${ARTIFACT_UPLOAD_OUTCOME:-not run})"
          fi
          {
            echo '## Python QA reports'
            echo
            echo "Coverage completeness: **$coverage_scope** (all three test groups must pass for a complete result)."
            echo "Artifact status: **$artifact_result**."
            echo
            echo '| Check | Result | Coverage |'
            echo '| --- | --- | --- |'
            echo "| Unit tests | $(status_label ci-results/unit.status) | — |"
            echo "| MLflow integration tests | $(status_label ci-results/mlflow.status) | — |"
            echo "| Other integration tests | $(status_label ci-results/integration.status) | — |"
            echo "| Source coverage gate | $(status_label ci-results/coverage-source.status) [$coverage_scope] | $(coverage_value reports/coverage-source.txt) |"
            echo "| Source + tests coverage gate | $(status_label ci-results/coverage-combined.status) [$coverage_scope] | $(coverage_value reports/coverage-combined.txt) |"
            echo
            if [ "$ARTIFACT_UPLOAD_OUTCOME" = "success" ]; then
              echo 'Reports are available in the python-qa-reports-${{ github.run_id }} artifact:'
              echo '- JUnit XML: reports/junit-unit.xml, reports/junit-mlflow.xml, reports/junit-integration.xml'
              echo '- Coverage text: reports/coverage-source.txt and reports/coverage-combined.txt'
              echo '- Coverage XML: reports/coverage.xml'
              echo '- Browsable HTML coverage: reports/coverage-html/'
            else
              echo 'Reports were not published as an artifact because the upload did not complete successfully.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"


  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: python -m pip install "pre-commit==4.7.0"

      - name: Run all pre-commit hooks
        run: python -m pre_commit run --all-files --show-diff-on-failure


  docker-build:
    name: Compose validation and image build
    runs-on: ubuntu-latest
    env:
      DAGSHUB_TOKEN: compose-config-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yaml config --quiet

      - name: Build Compose images
        run: docker compose -f docker-compose.yaml build
