
name: Python Quality Assurance

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-qa:
    name: Python QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest coverage flake8 pyright

      # Always run unit tests and collect coverage
      - name: Run unit tests with coverage
        env:
          PYTHONPATH: src
        run: |
          python -m coverage erase
          python -m coverage run -m pytest tests/unit/ -v

      # Integration tests run only when the dataset is available
      - name: Run integration tests when dataset exists
        if: hashFiles('data/raw/predictive_maintenance_5000.csv') != ''
        env:
          PYTHONPATH: src
        run: |
          python -m coverage run --append -m pytest tests/integration/ -v

      # Make skipped integration testing explicit
      - name: Report missing integration dataset
        if: hashFiles('data/raw/predictive_maintenance_5000.csv') == ''
        run: |
          echo "::warning::Integration tests skipped: dataset unavailable."
          echo "### Integration tests: NOT RUN" >> "$GITHUB_STEP_SUMMARY"
          echo "Dataset unavailable. DVC setup is pending." >> "$GITHUB_STEP_SUMMARY"

      - name: Check repository coverage
        run: python -m coverage report -m --fail-under=95

      - name: Check source coverage
        run: python -m coverage report -m --include="src/*" --fail-under=95

      - name: Run Flake8
        run: python -m flake8 src tests infra app

      - name: Run Pyright
        run: python -m pyright
